# Rainboids Rust workspace.
#
# Three member crates:
#   - sim         : canonical simulation (compiles native + WASM)
#   - server-bin  : authoritative multiplayer server binary
#   - client-wasm : wasm-bindgen wrapper used by the /mp browser client
#
# See docs/Multiplayer WASM Pivot – 2026-05-17.md for the architectural
# context that led to this layout.

[workspace]
members = ["sim", "server-bin", "client-wasm"]
resolver = "2"

# Workspace-wide profile tuning. Member crates may override per-target
# (client-wasm sets opt-level = "z" in its own Cargo.toml).
[profile.release]
lto         = "thin"
codegen-units = 1
strip       = true
panic       = "abort"
