# rainboids-client-wasm
#
# WebAssembly bindings crate that exposes the shared `rainboids-sim`
# crate to the Rainboids multiplayer browser client (served at `/mp`).
# Compiled with `wasm-pack build --target web` into `js/mp/wasm/`,
# this crate is the thin glue layer between the canonical Rust
# simulation and the JS engine driver / renderer. Phase 0 only ships
# smoke functions; real sim integration arrives in Phase 1.

[package]
name = "rainboids-client-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rainboids-sim = { path = "../sim" }
wasm-bindgen = "0.2"

# `getrandom` is pulled in transitively by `rand` / `rand_pcg` (sim deps).
# On `wasm32-unknown-unknown` the default impl errors at compile time
# because there's no OS entropy source — we have to opt into the `js`
# feature so getrandom uses the browser's `crypto.getRandomValues()`.
# Declared as a direct dep here (rather than via `rand`'s feature flag)
# so Cargo feature-unification applies it everywhere it's needed during
# WASM builds. Native builds (server-bin) ignore this.
getrandom = { version = "0.2", features = ["js"] }
# `uuid` also needs a wasm-specific randomness backend. Same rationale.
uuid = { version = "1", features = ["js"] }

# Profile tuning lives at the workspace root (server/Cargo.toml). For
# WASM-size-specific release tuning (opt-level = "z" + LTO), see the
# wasm-release profile / build commands in package.json.
