[package]
name = "rainboids-sim"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "Rainboids canonical simulation crate — compiles native + WASM."
license = "MIT"
publish = false

# The sim crate currently embeds the wire-protocol module (codegen'd from
# schema/protocol.toml into src/protocol/generated.rs). This is a Phase 0
# pragmatic decision — see docs/Multiplayer WASM Pivot – 2026-05-17.md.
# Splitting protocol into its own crate is Phase 1+ cleanup.

[dependencies]
serde    = { version = "1", features = ["derive"] }
bincode  = "1.3"
glam     = { version = "0.27", features = ["serde"] }
rand     = "0.8"
rand_pcg = "0.3"
uuid     = { version = "1", features = ["v4", "serde"] }
nanoid   = "0.4"
thiserror = "1"

[dev-dependencies]
pretty_assertions = "1"
serde_json        = "1"
