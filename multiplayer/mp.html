<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>Rainboids Multiplayer (experimental)</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        /* Phase 4 step 6 graphics — three-canvas WebGL bloom stack
           mirroring solo (index.html / styles.css). glCanvas (WebGL,
           bottom: starfield + additive particles) → mp-canvas (Canvas2D,
           middle: ships / asteroids / enemies) → bulletCanvas (WebGL,
           top: additive bullet glow). mp-canvas keeps its id so
           mp-main.js + the QA-13 smoke selector are unchanged. */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        #glCanvas {
            background: #000;
            z-index: 0;
        }
        #mp-canvas {
            background: transparent;
            z-index: 1;
        }
        #bulletCanvas {
            background: transparent;
            z-index: 2;
            pointer-events: none;
        }
        #mp-debug {
            position: absolute;
            top: 8px;
            left: 8px;
            color: #fff;
            font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            line-height: 1.4;
            opacity: 0.9;
            pointer-events: none;
            white-space: pre-wrap;
            z-index: 10;
        }
    </style>
</head>
<body>
    <!--
        MP entry point for the WASM-pivot architecture.
        See: docs/Multiplayer WASM Pivot - 2026-05-17.md

        Phase 0 is just a smoke harness: it loads the wasm-pack output
        from js/mp/wasm/ and verifies the round-trip works (smoke_test()
        and build_info()). The real MP game (renderer, networking,
        prediction) arrives in Phase 1+.
    -->
    <!-- WebGL particle + starfield layer (bottom). -->
    <canvas id="glCanvas"></canvas>
    <!-- Canvas2D entity layer (middle): ships, asteroids, enemies,
         mines, HUD-adjacent draws. Transparent so glCanvas shows through. -->
    <canvas id="mp-canvas"></canvas>
    <!-- WebGL bullet layer (top): additive bullet/missile glow. -->
    <canvas id="bulletCanvas"></canvas>
    <div id="mp-debug"></div>

    <script type="module" src="js/mp/mp-main.js"></script>
</body>
</html>
