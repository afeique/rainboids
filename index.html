<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <title>Rainboids: Supercharged Asteroids</title>
    <!-- Fonts are now bundled locally via @font-face in css/styles.css.
         Previously: 4 Google Fonts <link> tags + 2 preconnects. Removed
         in desktop-port Phase 2 (2026-05-18) so the Electron build works
         offline and the web build avoids the FOIT/FOUT from a remote CSS
         round-trip. Source files live in css/fonts/. -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- <div id="loading-screen">
        <h1>RAINBOIDS</h1>
        <div id="loading-container">
            <div id="loading-bar">
                <div id="loading-progress"></div>
            </div>
            <p id="loading-text">Loading...</p>
        </div>
    </div> -->
    
<!-- <div id="title-screen">
        <h1 id="game-title"></h1>
        <p id="high-score-display"></p>
        <p id="start-prompt">Press Any Key To Start</p>
    </div> -->
    
    <!-- Mobile / tablet block — shown only when isMobileOrTabletDevice() in main.js
         returns true. Game initialization is skipped entirely when this is visible. -->
    <div id="desktop-only-block">
        <div class="desktop-only-icon">🖥️</div>
        <h1>Desktop only</h1>
        <p>Rainboids is designed to be played on a desktop or laptop with a mouse and keyboard.</p>
        <p class="desktop-only-sub">Please open this page on a computer to play.</p>
    </div>

    <!-- 5.102.0 — Every HUD/overlay element below is a pure empty stub.
         Children are built by js/modules/ui/static-dom.js::buildStaticDom()
         at boot, BEFORE the engine / UIManager / StatsOverlay look up
         these DOM ids. Centralizing markup in JS removes static-vs-
         dynamic drift that produced flash-of-stale-content on first
         open (especially the ASSISTS tab which previously rendered
         desktop rows before being replaced with the mobile-trimmed
         set). -->
    <div id="lives-display" class="ui-element"></div>
    <button id="hud-shop-btn" aria-label="Upgrades"></button>
    <button id="hud-pause-btn" aria-label="Pause"></button>

    <div id="stats-overlay"></div>
    <div id="pause-overlay"></div>
    <div id="wave-pick-overlay"></div>
    <div id="shop-suggest-overlay"></div>
    <div id="shop-overlay"></div>
    <div id="tutorial-overlay"></div>
    <div id="customization-overlay"></div>

    <div id="powerup-hud" class="ui-element"></div>

    <!-- WebGL particle layer — sits underneath gameCanvas. Draws additive
         particles (embers, flashes, shrapnel, rings, sparkles, classic
         explosions). gameCanvas keeps a transparent background so this
         layer shows through. -->
    <canvas id="glCanvas"></canvas>
    <canvas id="gameCanvas"></canvas>
    <!-- 5.79.2 — WebGL bullet layer. Sits ABOVE gameCanvas so bullets
         render on top of asteroids / enemies / player (drawn on
         gameCanvas) but BELOW HUD elements. Shares the WebGL2 pattern
         with glCanvas but has its own context. -->
    <canvas id="bulletCanvas"></canvas>

    <!-- Contextual hint overlay (built by static-dom.js; driven at
         runtime by js/modules/ui/hint-system.js). -->
    <div id="hint-overlay"></div>

    <!-- Load the modular JavaScript after external libraries -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
