<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <title>Rainboids: Supercharged Asteroids</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- <div id="title-screen">
        <h1 id="game-title"></h1>
        <p id="high-score-display"></p>
        <p id="start-prompt">Press Any Key To Start</p>
    </div> -->
    
    <!-- Mobile / tablet block — shown only when isMobileOrTabletDevice() in main.js
         returns true. Game initialization is skipped entirely when this is visible. -->
    <div id="desktop-only-block">
        <div class="desktop-only-icon">🖥️</div>
        <h1>Desktop only</h1>
        <p>Rainboids is designed to be played on a desktop or laptop with a mouse and keyboard.</p>
        <p class="desktop-only-sub">Please open this page on a computer to play.</p>
    </div>

    <!-- <div id="shield-tanks"></div> -->
    <div id="lives-display" class="ui-element">▲<br>▲▲</div>
    <!-- <div id="score" class="ui-element">0</div>
    <div id="shop-button" class="ui-element">SHOP</div> -->
    
    <!-- <div id="game-message-overlay" class="ui-element">
        <h1 id="message-title" class="message-title" style="display: none;"></h1>
        <p id="message-subtitle" class="message-subtitle" style="display: none;"></p>
    </div> -->

    <button id="hud-shop-btn" aria-label="Shop">🛒</button>

    <button id="hud-pause-btn" aria-label="Pause">
        <span class="hud-pause-bar"></span>
        <span class="hud-pause-bar"></span>
    </button>

    <!-- 5.100.2 — Stats / Pause / Wave-pick / Shop overlays are now
         pure stubs. Every child element is built by
         js/modules/ui/static-dom.js::buildStaticDom() at boot
         (called from main.js BEFORE UIManager / StatsOverlay
         constructors look up DOM ids). Centralizing the markup in
         JS removes the static-vs-dynamic drift that produced
         flash-of-stale-content on first open. -->
    <div id="stats-overlay"></div>

    <div id="pause-overlay"></div>

    <div id="wave-pick-overlay"></div>

    <div id="shop-overlay"></div>

<div id="customization-overlay">
        <h2>Control Layout</h2>
        <p>Drag the controls to your desired positions, then press Save.</p>
        <button id="save-layout-button">Save & Close</button>
    </div>

    <div id="powerup-hud" class="ui-element"></div>

    <!-- WebGL particle layer — sits underneath gameCanvas. Draws additive
         particles (embers, flashes, shrapnel, rings, sparkles, classic
         explosions). gameCanvas keeps a transparent background so this
         layer shows through. -->
    <canvas id="glCanvas"></canvas>
    <canvas id="gameCanvas"></canvas>
    <!-- 5.79.2 — WebGL bullet layer. Sits ABOVE gameCanvas so bullets
         render on top of asteroids / enemies / player (drawn on
         gameCanvas) but BELOW HUD elements. Shares the WebGL2 pattern
         with glCanvas but has its own context. -->
    <canvas id="bulletCanvas"></canvas>

    <!-- Contextual hint overlay (driven by js/modules/ui/hint-system.js) -->
    <div id="hint-overlay">
        <div class="hint-text"></div>
    </div>

    <!-- Load the modular JavaScript after external libraries -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
