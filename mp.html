<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>Rainboids Multiplayer (experimental)</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        #mp-canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        #mp-debug {
            position: absolute;
            top: 8px;
            left: 8px;
            color: #fff;
            font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            line-height: 1.4;
            opacity: 0.9;
            pointer-events: none;
            white-space: pre-wrap;
            z-index: 10;
        }
    </style>
</head>
<body>
    <!--
        MP entry point for the WASM-pivot architecture.
        See: docs/Multiplayer WASM Pivot - 2026-05-17.md

        Phase 0 is just a smoke harness: it loads the wasm-pack output
        from js/mp/wasm/ and verifies the round-trip works (smoke_test()
        and build_info()). The real MP game (renderer, networking,
        prediction) arrives in Phase 1+.
    -->
    <canvas id="mp-canvas"></canvas>
    <div id="mp-debug"></div>

    <script type="module" src="js/mp/mp-main.js"></script>
</body>
</html>
