<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rainboids — Multiplayer (experimental)</title>
  <style>
    /* SP's pixel font (bundled in css/fonts/) so the canvas HUD matches solo. */
    @font-face {
      font-family: 'Press Start 2P';
      font-display: swap;
      src: url('css/fonts/press-start-2p-latin.woff2') format('woff2');
    }
    html, body {
      margin: 0; padding: 0; height: 100%; background: #04040a;
      color: #cdd6f4; font-family: monospace; overflow: hidden;
    }
    #game {
      position: fixed; inset: 0; display: block;
      width: 100vw; height: 100vh;
      background: #04040a; cursor: crosshair; z-index: 0;
    }
    #bar {
      position: fixed; top: 0; left: 0; right: 0; height: 28px; z-index: 10;
      display: flex; gap: 18px; align-items: center; padding: 4px 12px;
      font-size: 13px; background: rgba(0,0,0,0.5);
    }
    #status { color: #a6e3a1; }
    #hud { color: #89b4fa; }
    .tag { color: #f38ba8; font-weight: bold; }
  </style>
</head>
<body>
  <div id="bar">
    <span class="tag">RAINBOIDS · MP</span>
    <label>room <input id="room" type="text" maxlength="24" placeholder="(public)" style="width:90px;background:#11131f;color:#cdd6f4;border:1px solid #333;font-family:monospace;" /></label>
    <span id="status">starting…</span>
    <span id="hud"></span>
  </div>
  <canvas id="game"></canvas>
  <script type="module" src="js/mp/mp-main.js"></script>
</body>
</html>
