[package]
name = "rainboids-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "Authoritative WebSocket server for Rainboids co-op multiplayer."
license = "MIT"
publish = false

[lib]
name = "rainboids_server"
path = "src/lib.rs"

[[bin]]
name = "rainboids-server"
path = "src/main.rs"

[dependencies]
# Canonical simulation crate (workspace member).
rainboids-sim = { path = "../sim" }

# Async runtime + HTTP/WS stack
tokio          = { version = "1", features = ["full"] }
tokio-util     = { version = "0.7", features = ["rt"] }
axum           = { version = "0.7", features = ["ws", "macros"] }
tower          = { version = "0.4" }
tower-http     = { version = "0.5", features = ["trace", "cors"] }
futures-util   = "0.3"

# Serialization (shared with sim's wire format)
serde          = { version = "1", features = ["derive"] }
bincode        = "1.3"

# Concurrency + math (some carried for room-actor and snapshot code)
dashmap        = "5"
glam           = { version = "0.27", features = ["serde"] }
rand           = "0.8"
rand_pcg       = "0.3"

# IDs + codes
uuid           = { version = "1", features = ["v4", "serde"] }
nanoid         = "0.4"

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
metrics            = "0.23"
metrics-exporter-prometheus = "0.15"

# CLI + config
clap           = { version = "4", features = ["derive", "env"] }
dotenvy        = "0.15"

# Errors
thiserror      = "1"
anyhow         = "1"

[dev-dependencies]
pretty_assertions  = "1"
tokio-tungstenite  = "0.21"
